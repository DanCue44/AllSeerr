---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Image

# develop -> :develop, :develop-<sha>, the testing channel
# main    -> :main, :main-<sha>, every merged change
# v* tag  -> :<version>, :<major.minor>, :latest and a GitHub release
# :latest only moves on releases
#
# Images are linux/amd64 only. They are built on a self-hosted amd64 runner
# with the classic Docker builder (no buildx/BuildKit on that host), so the
# Dockerfile must not use BuildKit-only syntax.

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

env:
  IMAGE: ghcr.io/dancue44/allseerr
  # Unique per run, used for the local image tag and the cleanup label.
  CI_KEY: allseerr-ci-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  branch:
    name: Build and push branch image
    if: github.ref_type == 'branch'
    runs-on: [self-hosted, unraid, allseerr]
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Commit timestamp
        id: ts
        run: echo "timestamp=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=main,enable=${{ github.ref_name == 'main' }}
            type=raw,value=develop,enable=${{ github.ref_name == 'develop' }}
            type=sha,prefix=${{ github.ref_name }}-,format=short
          labels: |
            org.opencontainers.image.title=Allseerr
            org.opencontainers.image.description=Request management for movies, series, music, books and audiobooks, based on Seerr
            org.opencontainers.image.licenses=MIT

      - name: Build
        shell: bash
        env:
          LABELS: ${{ steps.meta.outputs.labels }}
          COMMIT_TAG: ${{ github.sha }}
          SOURCE_DATE_EPOCH: ${{ steps.ts.outputs.timestamp }}
        run: bash .github/scripts/image-build.sh

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        shell: bash
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: bash .github/scripts/image-push.sh

      - name: Clean up
        if: always()
        shell: bash
        run: bash .github/scripts/image-cleanup.sh

  verify-tag:
    name: Check tag matches allseerr.json
    if: github.ref_type == 'tag'
    runs-on: [self-hosted, unraid, allseerr]
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compare tag with the app version
        id: check
        env:
          TAG: ${{ github.ref_name }}
        # The app reports its version from allseerr.json, so a tag that does not
        # match it would publish an image that shows a different version.
        run: |
          expected="v$(jq -r '"\(.seerrVersion).\(.revision)"' allseerr.json)"
          base="${TAG%%-*}"
          if [ "$base" != "$expected" ]; then
            echo "::error::Tag $TAG does not match allseerr.json ($expected)"
            exit 1
          fi
          if [ "$base" != "$TAG" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Push release image and create release
    needs: verify-tag
    runs-on: [self-hosted, unraid, allseerr]
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Commit timestamp
        id: ts
        run: echo "timestamp=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=match,pattern=^v(.*)$,group=1
            type=match,pattern=^v(\d+\.\d+)\.,group=1,enable=${{ needs.verify-tag.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.verify-tag.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=Allseerr
            org.opencontainers.image.description=Request management for movies, series, music, books and audiobooks, based on Seerr
            org.opencontainers.image.licenses=MIT

      - name: Build
        shell: bash
        env:
          LABELS: ${{ steps.meta.outputs.labels }}
          COMMIT_TAG: ${{ github.ref_name }}
          SOURCE_DATE_EPOCH: ${{ steps.ts.outputs.timestamp }}
        run: bash .github/scripts/image-build.sh

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        shell: bash
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: bash .github/scripts/image-push.sh

      # The runner has no gh CLI, so the release is created through the REST API.
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.verify-tag.outputs.prerelease }}
        run: |
          set -euo pipefail
          if [ "$PRERELEASE" = "true" ]; then latest=false; else latest=true; fi
          body="$(jq -n --arg tag "$TAG" --argjson pre "$PRERELEASE" --arg latest "$latest" \
            '{tag_name: $tag, name: ("Allseerr " + $tag), generate_release_notes: true, prerelease: $pre, make_latest: $latest}')"
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GH_REPO/releases" \
            -d "$body" | jq -r .html_url

      - name: Clean up
        if: always()
        shell: bash
        run: bash .github/scripts/image-cleanup.sh
