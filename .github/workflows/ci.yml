---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

# Only pushes to this repository run CI. The runner is self-hosted, so pull
# requests from forks must never start a job on it: there is no pull_request
# trigger, and outside contributors' workflow runs need a maintainer's approval
# (repository setting). Branches pushed here, including PR branches, still run.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test and build
    runs-on: [self-hosted, unraid, allseerr]
    timeout-minutes: 30
    # The self-hosted runner has no Node toolchain of its own, so the job runs
    # in a Node container (git, python3 and build tools included).
    container:
      image: node:22-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        # Version comes from packageManager in package.json
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        env:
          CYPRESS_INSTALL_BINARY: '0'
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Check i18n messages are extracted
        run: node bin/check-i18n.js

      - name: Typecheck server and client
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Production build
        env:
          COMMIT_TAG: ${{ github.sha }}
        run: pnpm build
