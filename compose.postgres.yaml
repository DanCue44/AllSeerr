services:
  allseerr:
    image: ghcr.io/dancue44/allseerr:latest
    container_name: allseerr
    init: true
    environment:
      LOG_LEVEL: 'info'
      TZ: 'Etc/UTC'
      DB_TYPE: 'postgres' # Which DB engine to use. The default is "sqlite". To use postgres, this needs to be set to "postgres"
      DB_HOST: 'postgres' # The host (url) of the database
      DB_PORT: '5432' # The port to connect to
      DB_USER: 'allseerr' # Username used to connect to the database
      DB_PASS: 'allseerr' # Password of the user used to connect to the database
      DB_NAME: 'allseerr' # The name of the database to connect to
      DB_LOG_QUERIES: 'false' # Whether to log the DB queries for debugging
      DB_USE_SSL: 'false' # Whether to enable ssl for database connection
      DB_POOL_SIZE: '10' # The number of connections to maintain in the connection pool
    ports:
      - '5055:5055'
    volumes:
      # Settings and logs still live here when using postgres; it must be writable by UID 1000
      - ./config:/app/config
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  postgres:
    image: postgres:18
    container_name: allseerr-postgres
    environment:
      POSTGRES_USER: allseerr
      POSTGRES_PASSWORD: allseerr
      POSTGRES_DB: allseerr
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U allseerr -d allseerr']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  postgres:
